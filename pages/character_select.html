<html>
  <head>
    <title>Quantum Hangman</title>
  </head>
  <body>
    <div style="margin: auto">
      <h1 style="text-align: center">please select your character:</h1>
    </div>
    <div style="display: flex; align-items: center; justify-content: center">
      <button onclick="bob(), bob_next()">bob</button>
      <button onclick="eve(), eve_next()">eve</button>
    </div>
    <script>"./main.js"</script>
    <script>
    function bob_next(){
      window.location.href = 'bob.html';
    }
    function eve_next(){
      window.location.href = 'eve.html';
    }
    </script>
  </body>
</html>
